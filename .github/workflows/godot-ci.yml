name: AXEHOLD Godot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

concurrency:
  group: axehold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-and-build-web:
    name: Validate + Web build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls -lah "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Godot version
        run: godot --version

      - name: Import project assets and validate scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "GDScript parse errors detected during import"
            exit 1
          fi

      - name: Smoke-test scenes
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci/smoke_test.gd 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-smoke.log; then
            echo "GDScript parse errors detected during smoke test"
            exit 1
          fi

      - name: Gameplay mechanics smoke-test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_gameplay_smoke.tscn 2>&1 | tee /tmp/godot-gameplay.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-gameplay.log; then
            echo "GDScript parse errors detected during gameplay smoke test"
            exit 1
          fi

      - name: Living camp progression smoke-test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_camp_smoke.tscn 2>&1 | tee /tmp/godot-camp.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-camp.log; then
            echo "GDScript parse errors detected during living camp smoke test"
            exit 1
          fi

      - name: Expedition wow regression smoke-test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_expedition_smoke.tscn 2>&1 | tee /tmp/godot-expedition.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-expedition.log; then
            echo "GDScript parse errors detected during expedition smoke test"
            exit 1
          fi

      - name: Commercial polish regression smoke-test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_polish_smoke.tscn 2>&1 | tee /tmp/godot-polish.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-polish.log; then
            echo "GDScript parse errors detected during polish smoke test"
            exit 1
          fi

      - name: Mobile controls regression smoke-test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_mobile_smoke.tscn 2>&1 | tee /tmp/godot-mobile.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-mobile.log; then
            echo "GDScript parse errors detected during mobile smoke test"
            exit 1
          fi

      - name: V1 resource loop regression smoke-test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v1_loop_smoke.tscn 2>&1 | tee /tmp/godot-v1-loop.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v1-loop.log; then
            echo "GDScript parse errors detected during v1 resource-loop test"
            exit 1
          fi

      - name: Boot main scene briefly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-boot.log; then
            echo "GDScript parse errors detected during boot"
            exit 1
          fi

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Verify Web output
        run: |
          test -f build/web/index.html
          test -f build/web/index.wasm
          ls -lah build/web

      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: AXEHOLD-Web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-pages:
    name: Deploy playable build to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
