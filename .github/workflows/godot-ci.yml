      - name: V1.21 visual identity regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v121_visual_identity_smoke.tscn 2>&1 | tee /tmp/godot-v121-visual-identity.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v121-visual-identity.log; then
            echo "GDScript parse errors detected during v1.21 visual identity test"
            exit 1
          fi

      - name: V1.22 Forgotten Forest art overhaul regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v122_forest_art_overhaul_smoke.tscn 2>&1 | tee /tmp/godot-v122-forest-art.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v122-forest-art.log; then
            echo "GDScript parse errors detected during v1.22 forest art test"
            exit 1
          fi

      - name: V1.23 Concept I vertical slice regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 res://scenes/ci_v123_visual_slice_smoke.tscn 2>&1 | tee /tmp/godot-v123-visual-slice.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v123-visual-slice.log; then
            echo "GDScript parse errors detected during v1.23 visual slice test"
            exit 1
          fi

      - name: V1.26 production art full expedition regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 15 res://scenes/ci_v126_visual_v2_smoke.tscn 2>&1 | tee /tmp/godot-v126-visual-v2.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v126-visual-v2.log; then
            echo "GDScript parse errors detected during v1.26 production art test"
            exit 1
          fi

      - name: Boot main scene briefly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-boot.log; then
            echo "GDScript parse errors detected during boot"
            exit 1
          fi

      - name: Export AXEHOLD Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Prepare Game 2 prototype
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/game2
          mkdir -p /tmp/game2
          base64 -d .game2/hearth_prototype_01.zip.b64 > /tmp/game2.zip
          unzip -q /tmp/game2.zip -d /tmp/game2
          cp .game2/export_presets.cfg /tmp/game2/hearth_prototype_01/export_presets.cfg
          sed -i 's/var lit := s.distance_to(HEARTH_POS) <= light_radius/var lit: bool = (s as Vector2).distance_to(HEARTH_POS) <= light_radius/' /tmp/game2/hearth_prototype_01/scripts/main.gd
          sed -i 's/draw_ellipse(draw_pos + Vector2(0,18), Vector2(20,7), Color(0,0,0,0.30))/_draw_ellipse_custom(draw_pos + Vector2(0,18), Vector2(20,7), Color(0,0,0,0.30))/' /tmp/game2/hearth_prototype_01/scripts/main.gd
          sed -i 's/^func draw_ellipse(center: Vector2, radii: Vector2, color: Color) -> void:/func _draw_ellipse_custom(center: Vector2, radii: Vector2, color: Color) -> void:/' /tmp/game2/hearth_prototype_01/scripts/main.gd
          (cd /tmp/game2/hearth_prototype_01 && git apply "$GITHUB_WORKSPACE/.game2/floating_joystick.patch")
          base64 -d .game2/main_v02.gd.gz.b64 | gzip -dc > /tmp/game2/hearth_prototype_01/scripts/main.gd
          sed -i 's/config\/name="Hearth Prototype 0.1"/config\/name="Hearth Prototype 0.2 — Three Nights"/' /tmp/game2/hearth_prototype_01/project.godot

      - name: Validate Game 2 prototype
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path /tmp/game2/hearth_prototype_01 --quit 2>&1 | tee /tmp/game2-import.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/game2-import.log; then
            echo "Game 2 GDScript parse errors detected"
            exit 1
          fi

      - name: Export Game 2 Web build
        run: |
          mkdir -p build/web/game2
          godot --headless --path /tmp/game2/hearth_prototype_01 --export-release Web "$GITHUB_WORKSPACE/build/web/game2/index.html"

      - name: Verify Web output
        run: |
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/game2/index.html
          test -f build/web/game2/index.wasm
          ls -lah build/web
          ls -lah build/web/game2

      - name: Upload playable Web build
        uses: actions/upload-artifact@v4
        with:
          name: AXEHOLD-Web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-pages:
    name: Deploy playable build to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
