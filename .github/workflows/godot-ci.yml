      - name: V1.15 living expedition regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v115_living_expedition_smoke.tscn 2>&1 | tee /tmp/godot-v115-living.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v115-living.log; then
            echo "GDScript parse errors detected during v1.15 living expedition test"
            exit 1
          fi

      - name: V1.16 threat + endless regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v116_progression_smoke.tscn 2>&1 | tee /tmp/godot-v116-progression.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v116-progression.log; then
            echo "GDScript parse errors detected during v1.16 progression test"
            exit 1
          fi

      - name: V1.17 first-run + calibration regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v117_first_run_smoke.tscn 2>&1 | tee /tmp/godot-v117-first-run.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v117-first-run.log; then
            echo "GDScript parse errors detected during v1.17 first-run test"
            exit 1
          fi

      - name: V1.18 Events 2.0 + expedition memory regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v118_events_memory_smoke.tscn 2>&1 | tee /tmp/godot-v118-events.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v118-events.log; then
            echo "GDScript parse errors detected during v1.18 Events 2.0 test"
            exit 1
