      - name: V1.10 production feel regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v110_production_feel_smoke.tscn 2>&1 | tee /tmp/godot-v110-feel.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v110-feel.log; then
            echo "GDScript parse errors detected during v1.10 production feel test"
            exit 1
          fi

      - name: V1.11 living camp + contracts regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v111_living_camp_contracts_smoke.tscn 2>&1 | tee /tmp/godot-v111-camp.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v111-camp.log; then
            echo "GDScript parse errors detected during v1.11 living camp/contracts test"
            exit 1
          fi

      - name: V1.12 dynamic world + elites regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v112_dynamic_world_smoke.tscn 2>&1 | tee /tmp/godot-v112-world.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v112-world.log; then
            echo "GDScript parse errors detected during v1.12 dynamic-world test"
            exit 1
          fi

      - name: V1.13 visual reboot regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v113_visual_reboot_smoke.tscn 2>&1 | tee /tmp/godot-v113-visual.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v113-visual.log; then
            echo "GDScript parse errors detected during v1.13 visual reboot test"
            exit 1
          fi

      - name: V1.14 full upgrade regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v114_full_upgrade_smoke.tscn 2>&1 | tee /tmp/godot-v114-full.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v114-full.log; then
            echo "GDScript parse errors detected during v1.14 full-upgrade test"
