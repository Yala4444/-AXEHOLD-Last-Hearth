      - name: V1.19 Buildcraft + synergy regression
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/ci_v119_buildcraft_smoke.tscn 2>&1 | tee /tmp/godot-v119-buildcraft.log
          if grep -E "SCRIPT ERROR: Parse Error|Failed to load script" /tmp/godot-v119-buildcraft.log; then
